# Østfoldbussen – lokal/offentlig standardinstallasjon.
#
# Standardoppsett bruker .env og ./state (se docs/quickstart.md).
# Produksjon bør bruke egne env-/secret-filer utenfor repoet, HTTPS og en
# operatørstyrt backup/retensjonsordning. Admin/API eksponeres ikke offentlig.
name: ostfoldbussen

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ostfoldbussen-app:local
    container_name: ostfoldbussen-app
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /var/lib/ostfoldbussen/app.db
      SECRETS_DIR: /run/secrets
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./state/lib:/var/lib/ostfoldbussen
      - ./state/backups:/var/backups
      - ./state/secrets:/run/secrets:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 0.75
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    container_name: ostfoldbussen-caddy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
